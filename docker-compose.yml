services:
  mongo:
    image: mongo:7
    container_name: waternet-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - waternet_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      bash -c '
      mongosh --host mongo:27017 --quiet --eval "
        try { rs.status().ok }
        catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }) }
      "
      '

  # One-shot seed. Idempotent — only writes when the database is empty,
  # unless SEED_FORCE=true. Block backend startup until this finishes.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waternet-seed
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    # Compose reads only the .env sitting beside this file, so backend/.env has
    # to be named explicitly or its chain and mail settings never reach the
    # container. Keys listed under `environment:` win over this file, so only
    # values that must differ inside compose belong there.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGODB_URI: "mongodb://mongo:27017/waternet?replicaSet=rs0&directConnection=true"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      NODE_ENV: "development"
      DISABLE_MQTT: "true"
      SEED_FORCE: "${SEED_FORCE:-false}"
    command: ["node", "scripts/seed.js"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waternet-backend
    depends_on:
      seed:
        condition: service_completed_successfully
    # Chain, mail and MQTT credentials come from backend/.env — see the note on
    # the seed service. Anything below overrides that file, so it holds only
    # what has to be container-specific.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGODB_URI: "mongodb://mongo:27017/waternet?replicaSet=rs0&directConnection=true"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      JWT_EXPIRES_IN: "7d"
      PORT: "4000"
      CORS_ORIGINS: "*"
      NODE_ENV: "development"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # MQTT stays off inside compose unless explicitly switched on; the broker
      # credentials themselves come from backend/.env.
      DISABLE_MQTT: "${DISABLE_MQTT:-true}"
      MQTT_CLIENT_ID: "${MQTT_CLIENT_ID:-waternet-backend}"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
        # Must match AUTH_BLOCKCHAIN_ENABLED in backend/.env. When the two
        # disagree the login page offers wallet sign-in and the API answers
        # "Blockchain auth is disabled" — the flag is baked into the bundle at
        # build time, so changing it needs a frontend rebuild, not a restart.
        VITE_AUTH_BLOCKCHAIN_ENABLED: "${VITE_AUTH_BLOCKCHAIN_ENABLED:-true}"
    container_name: waternet-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  mobile:
    build:
      context: ./mobile
    container_name: waternet-mobile
    working_dir: /app
    environment:
      EXPO_PUBLIC_BACKEND_URL: "http://localhost:4000"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      EXPO_NO_DOCTOR: "1"
    command: ["npm", "start", "--", "--web", "--host", "lan"]
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  waternet_mongo_data:
