# Socket.IO upgrades to WebSocket; a plain proxy_pass without these two headers
# leaves the connection as HTTP and the handshake fails. `close` for non-upgrade
# requests keeps Socket.IO's long-polling fallback working.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache static assets (Vite emits hashed filenames).
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Proxy API calls to the backend container on the docker network.
  location /api/ {
    # Resolve `backend` per request via docker's embedded DNS. Without this,
    # nginx caches the container IP from startup and 502s once the backend
    # container restarts onto a different IP. The variable in proxy_pass is
    # what forces re-resolution, so the URI must be passed explicitly.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;
    proxy_pass         $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Socket.IO — live telemetry and device availability push. Must be declared
  # before the SPA fallback, which would otherwise answer the handshake with
  # index.html and silently break every real-time update in the app.
  location /socket.io/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $socket_upstream http://backend:4000;
    proxy_pass         $socket_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Long-lived connections: the default 60s read timeout would drop an idle
    # socket and force a reconnect cycle every minute.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering    off;
  }

  # Anything else falls back to index.html (SPA routes are client-side).
  # index.html must never be cached: it is the only file whose name is stable,
  # and it carries the hashed asset names. Without an explicit Cache-Control the
  # browser applies heuristic freshness, keeps serving a stale index.html, and
  # therefore keeps loading the old (immutable, 30-day) bundle it points at —
  # which looks exactly like a deploy that "didn't take".
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
