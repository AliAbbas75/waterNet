services:
  besu:
    # Built from the Dockerfile beside this file, not the bare upstream image,
    # so local and Railway run the same thing — same genesis, same bootstrap,
    # same healthcheck. That is the whole point of having the Dockerfile.
    build:
      context: .
    image: waternet-besu:latest
    container_name: waternet-besu
    # The validator identity comes from the environment, not from git. See
    # config/bootstrap.sh and the README for why, and what to do if it is lost.
    environment:
      CHAIN_VALIDATOR_KEY: "${CHAIN_VALIDATOR_KEY:-}"
    ports:
      # Bound to loopback deliberately. The RPC has no authentication and
      # host-allowlist is "*", so anything that can reach this port can drive
      # the chain. Only the backend needs it.
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST -H 'Content-Type: application/json'
          --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
          http://localhost:8545 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
